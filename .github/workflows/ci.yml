name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Os testes sobem um PostgreSQL em contêiner (Testcontainers); o runner já tem Docker.
      - run: dotnet test api/Portfolio.slnx

  web:
    name: Site (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
